[project]
name = "nemodrive-ai"
version = "0.1.0"
description = "NVIDIA Nemotron In-Cabin Proactive Safety & Accident Prevention Voice Copilot"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.38.0",
    "openai>=1.50.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.1",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "plotly>=5.24.0",
    "gtts>=2.5.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "black>=24.8.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
